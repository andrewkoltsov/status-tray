<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Tray</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search services…" autocomplete="off" autofocus>
  </header>

  <main>
    <ul id="services" aria-label="Services"></ul>
    <p id="empty" hidden>No services match.</p>
  </main>

  <section class="options">
    <label class="row">
      <span>Check every</span>
      <select id="interval">
        <option value="1">1 minute</option>
        <option value="2">2 minutes</option>
        <option value="5">5 minutes</option>
        <option value="10">10 minutes</option>
        <option value="15">15 minutes</option>
      </select>
    </label>
    <label class="row">
      <span>Launch at login</span>
      <input id="autostart" type="checkbox">
    </label>
  </section>

  <footer>
    <div id="update" class="update" hidden></div>
    <div class="links">
      <span id="version"></span>
      <a href="#" id="request">Missing a service? Request it</a>
      <a href="#" id="releases">Releases</a>
    </div>
    <div id="error" class="error" role="alert" hidden></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
